name: Croatian Burocrats
language: python
variables:
  - name: input
    inputType: InputTopic
    multiline: false
    description: Name of the input topic to listen to.
    defaultValue: highway-2
  - name: output
    inputType: OutputTopic
    multiline: false
    description: Name of the output topic to write to.
    defaultValue: colours
  - name: consumer_group
    inputType: FreeText
    multiline: false
    defaultValue: v1
  - name: WATERMARK_FEATURE
    inputType: FreeText
    multiline: false
    description: "enable or disable watermarking (enable/disable)"
    defaultValue: enable
  - name: AUTO_OFFSET_RESET
    inputType: FreeText
    multiline: false
    description: Consumer auto.offset.reset — "latest" protects against stale-state replay
    defaultValue: earliest
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
libraryItemId: starter-transformation
