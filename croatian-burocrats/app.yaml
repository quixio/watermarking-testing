name: Croatian Burocrats
language: python
variables:
  - name: input
    inputType: InputTopic
    multiline: false
    description: Name of the input topic to listen to.
    defaultValue: highway-2
  - name: output
    inputType: OutputTopic
    multiline: false
    description: Name of the output topic to write to.
    defaultValue: colours
  - name: consumer_group
    inputType: FreeText
    multiline: false
    defaultValue: v1
  - name: CLEAR_STATE
    inputType: FreeText
    multiline: false
    description: Set to "true" to delete RocksDB state on startup (fixes stale window expiry after redeploy)
    defaultValue: "true"
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
libraryItemId: starter-transformation
