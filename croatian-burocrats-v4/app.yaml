name: Croatian Burocrats V4
language: python
variables:
  - name: input
    inputType: InputTopic
    multiline: false
    description: Name of the input topic to listen to.
    defaultValue: highway-2
  - name: output
    inputType: OutputTopic
    multiline: false
    description: Name of the output topic to write to.
    defaultValue: coloursV4
  - name: consumer_group
    inputType: FreeText
    multiline: false
    defaultValue: v1
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
