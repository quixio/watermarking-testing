# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Traffic Generator
    application: traffic-generator
    version: latest
    deploymentType: Service
    resources:
      cpu: 2000
      memory: 6500
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write into
        required: true
        value: highway-2
      - name: MESSAGES_PER_BRAND_COLOUR
        inputType: FreeText
        description: Number of messages to generate per (brand, colour) pair each second
        value: 100
      - name: RUN_ID_MIN_SECONDS
        inputType: FreeText
        description: Minimum number of seconds before rotating run_id
        value: 10
      - name: RUN_ID_MAX_SECONDS
        inputType: FreeText
        description: Maximum number of seconds before rotating run_id
        value: 10
      - name: RUN_ID_PREFIX
        inputType: FreeText
        description: Prefix used in the run_id
        value: run
    disabled: true
  - name: Croatian Burocrats
    application: croatian-burocrats
    version: latest
    deploymentType: Service
    resources:
      cpu: 100
      memory: 400
      replicas: 4
    state:
      enabled: true
      size: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        value: highway-2
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write to.
        value: colours
      - name: consumer_group
        inputType: FreeText
        value: {{consumer_group}}
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        description: Consumer auto.offset.reset — "latest" protects against stale-state replay
        value: earliest
  - name: CarColoursQuixLake
    application: carcoloursquixlake
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the Kafka input topic to consume from
        required: true
        value: colours
      - name: TABLE_NAME
        inputType: FreeText
        description: Table name for data organization and registration, else defaults to topic name
        value: carcolours_vx1
      - name: HIVE_COLUMNS
        inputType: FreeText
        description: Comma-separated list of columns for Hive partitioning. Include year/month/day/hour to extract from TIMESTAMP_COLUMN (e.g., location,year,month,day,sensor_type)
        value: run_id
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        description: Column containing timestamp values to extract year/month/day/hour from
        value: ts_ms
      - name: CATALOG_URL
        inputType: FreeText
        description: REST Catalog URL for optional table registration (leave empty to skip)
        value: {{QuixLakeCatURL}}
      - name: CATALOG_AUTH_TOKEN
        inputType: Secret
        description: If using a catalog, the respective auth token to access it
        secretKey: pat
      - name: AUTO_DISCOVER
        inputType: FreeText
        description: Automatically register table in REST Catalog on first write
        value: true
      - name: CATALOG_NAMESPACE
        inputType: FreeText
        description: Catalog namespace for table registration
        value: default
      - name: BATCH_SIZE
        inputType: FreeText
        description: Number of messages to batch before writing to storage
        value: 10000
      - name: COMMIT_INTERVAL
        inputType: FreeText
        description: Kafka commit interval in seconds
        value: 30
      - name: KAFKA_KEY_DESERIALIZER
        inputType: FreeText
        description: The key deserializer to use
        value: str
      - name: KAFKA_VALUE_DESERIALIZER
        inputType: FreeText
        description: the value deserializer to use
        value: json
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group name
        value: s3_direct_sink_v1.0
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        description: Where to start consuming if no offset exists
        value: earliest
      - name: LOGLEVEL
        inputType: FreeText
        description: Application logging level
        value: INFO
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        description: How many files can be written in parallel to storage at once (based on partitioning + batch size)
        value: 10
    blobStorage:
      bind: true
  - name: Croatian Burocrats NoWM
    application: croatian-burocrats-nowm
    version: latest
    deploymentType: Service
    resources:
      cpu: 100
      memory: 400
      replicas: 4
    state:
      enabled: true
      size: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        value: highway-2
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write to.
        value: coloursNoWM
      - name: consumer_group
        inputType: FreeText
        value: {{consumer_group}}
  - name: CarColoursDataLakeNoWM
    application: carcoloursdatalakenowm
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the Kafka input topic to consume from
        required: true
        value: coloursNoWM
      - name: TABLE_NAME
        inputType: FreeText
        description: Table name for data organization and registration, else defaults to topic name
        value: carcolours_nowm1
      - name: HIVE_COLUMNS
        inputType: FreeText
        description: Comma-separated list of columns for Hive partitioning. Include year/month/day/hour to extract from TIMESTAMP_COLUMN (e.g., location,year,month,day,sensor_type)
        value: run_id
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        description: Column containing timestamp values to extract year/month/day/hour from
        value: ts_ms
      - name: CATALOG_URL
        inputType: FreeText
        description: REST Catalog URL for optional table registration (leave empty to skip)
        value: {{QuixLakeCatURL}}
      - name: CATALOG_AUTH_TOKEN
        inputType: Secret
        description: If using a catalog, the respective auth token to access it
        secretKey: pat
      - name: AUTO_DISCOVER
        inputType: FreeText
        description: Automatically register table in REST Catalog on first write
        value: true
      - name: CATALOG_NAMESPACE
        inputType: FreeText
        description: Catalog namespace for table registration
        value: default
      - name: BATCH_SIZE
        inputType: FreeText
        description: Number of messages to batch before writing to storage
        value: 1000
      - name: COMMIT_INTERVAL
        inputType: FreeText
        description: Kafka commit interval in seconds
        value: 30
      - name: KAFKA_KEY_DESERIALIZER
        inputType: FreeText
        description: The key deserializer to use
        value: str
      - name: KAFKA_VALUE_DESERIALIZER
        inputType: FreeText
        description: the value deserializer to use
        value: json
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group name
        value: s3_direct_sink_v1.1
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        description: Where to start consuming if no offset exists
        value: earliest
      - name: LOGLEVEL
        inputType: FreeText
        description: Application logging level
        value: INFO
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        description: How many files can be written in parallel to storage at once (based on partitioning + batch size)
        value: 10
    blobStorage:
      bind: true
  - name: Croatian Burocrats V4
    application: croatian-burocrats-v4
    version: latest
    deploymentType: Service
    resources:
      cpu: 100
      memory: 400
      replicas: 4
    state:
      enabled: true
      size: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        value: highway-2
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write to.
        value: coloursV4
      - name: consumer_group
        inputType: FreeText
        value: {{consumer_group}}
  - name: CarColoursDataLake V4
    application: carcoloursdatalake-v4
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the Kafka input topic to consume from
        required: true
        value: coloursV4
      - name: TABLE_NAME
        inputType: FreeText
        description: Table name for data organization and registration, else defaults to topic name
        value: carcolours_v4
      - name: HIVE_COLUMNS
        inputType: FreeText
        description: Comma-separated list of columns for Hive partitioning. Include year/month/day/hour to extract from TIMESTAMP_COLUMN (e.g., location,year,month,day,sensor_type)
        value: run_id
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        description: Column containing timestamp values to extract year/month/day/hour from
        value: ts_ms
      - name: CATALOG_URL
        inputType: FreeText
        description: REST Catalog URL for optional table registration (leave empty to skip)
        value: {{QuixLakeCatURL}}
      - name: CATALOG_AUTH_TOKEN
        inputType: Secret
        description: If using a catalog, the respective auth token to access it
        secretKey: pat
      - name: AUTO_DISCOVER
        inputType: FreeText
        description: Automatically register table in REST Catalog on first write
        value: true
      - name: CATALOG_NAMESPACE
        inputType: FreeText
        description: Catalog namespace for table registration
        value: default
      - name: BATCH_SIZE
        inputType: FreeText
        description: Number of messages to batch before writing to storage
        value: 1000
      - name: COMMIT_INTERVAL
        inputType: FreeText
        description: Kafka commit interval in seconds
        value: 30
      - name: KAFKA_KEY_DESERIALIZER
        inputType: FreeText
        description: The key deserializer to use
        value: str
      - name: KAFKA_VALUE_DESERIALIZER
        inputType: FreeText
        description: the value deserializer to use
        value: json
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group name
        value: s3_direct_sink_v4
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        description: Where to start consuming if no offset exists
        value: earliest
      - name: LOGLEVEL
        inputType: FreeText
        description: Application logging level
        value: INFO
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        description: How many files can be written in parallel to storage at once (based on partitioning + batch size)
        value: 10
    blobStorage:
      bind: true
  - name: Watermarks tests
    application: watermarks-tests
    version: latest
    deploymentType: Service
    resources:
      cpu: 1000
      memory: 2000
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: watermarkstests
    state:
      enabled: true
      size: 1
    network:
      ports:
        - port: 80
          targetPort: 8080
    variables:
      - name: MARIMO_MODE
        inputType: FreeText
        description: Mode to run Marimo in
        value: edit
      - name: MARIMO_NOTEBOOK
        inputType: FreeText
        description: The notebook file to open (e.g., main.py)
        value: main.py
      - name: ANTHROPIC_API_KEY
        inputType: Secret
        description: Token generated from https://platform.claude.com/settings/keys.
        secretKey: CLAUDE_TOKEN
      - name: QUIX_LAKE_TOKEN
        inputType: Secret
        required: true
        secretKey: pat
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        icon: note_alt
        order: 0
        badge: BETA
  - name: Traffic Generator SingleRun
    application: traffic-generator-2
    version: latest
    deploymentType: Job
    resources:
      cpu: 1000
      memory: 4500
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write into
        required: true
        value: highway-2
      - name: MESSAGES_PER_BRAND_COLOUR
        inputType: FreeText
        description: Number of messages to generate per (brand, colour) pair each second
        value: 100
      - name: RUN_DURATION_SECONDS
        inputType: FreeText
        description: Total number of seconds to generate traffic before stopping
        value: 10
      - name: RUN_ID_PREFIX
        inputType: FreeText
        description: Prefix used in the run_id (replaces the hardcoded "run" part)
        value: 400kMsgsOffline
  - name: Traffic Generator V2
    application: traffic-generator-3
    version: latest
    deploymentType: Job
    resources:
      cpu: 1000
      memory: 4500
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write into
        required: true
        value: highway-2
      - name: MESSAGES_PER_BRAND_COLOUR
        inputType: FreeText
        description: Messages per (brand, colour) pair per 10s window. Total per window = 400 * this value.
        value: 50
      - name: NUM_WINDOWS
        inputType: FreeText
        description: Number of sequential event-time windows to generate
        value: 10
      - name: WINDOW_SECONDS
        inputType: FreeText
        description: Duration of each event-time window in seconds
        value: 15
      - name: SEND_DURATION_SECONDS
        inputType: FreeText
        description: Real-time seconds to spread each window's messages over (pacing)
        value: 2
      - name: RUN_ID_PREFIX
        inputType: FreeText
        description: Prefix used in the run_id
        value: 200kMsgBurst
    disabled: true
  - name: WatermarksLake
    application: carcoloursdatalakenowm
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the Kafka input topic to consume from
        required: true
        value: watermarks__burocrats_watermarking_v1--watermarks
      - name: TABLE_NAME
        inputType: FreeText
        description: Table name for data organization and registration, else defaults to topic name
        value: watermarks_table
      - name: HIVE_COLUMNS
        inputType: FreeText
        description: Comma-separated list of columns for Hive partitioning. Include year/month/day/hour to extract from TIMESTAMP_COLUMN (e.g., location,year,month,day,sensor_type)
        value: partition,year,month,day,hour
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        description: Column containing timestamp values to extract year/month/day/hour from
        value: ts_ms
      - name: CATALOG_URL
        inputType: FreeText
        description: REST Catalog URL for optional table registration (leave empty to skip)
        value: {{QuixLakeCatURL}}
      - name: CATALOG_AUTH_TOKEN
        inputType: Secret
        description: If using a catalog, the respective auth token to access it
        secretKey: pat
      - name: AUTO_DISCOVER
        inputType: FreeText
        description: Automatically register table in REST Catalog on first write
        value: true
      - name: CATALOG_NAMESPACE
        inputType: FreeText
        description: Catalog namespace for table registration
        value: default
      - name: BATCH_SIZE
        inputType: FreeText
        description: Number of messages to batch before writing to storage
        value: 1000
      - name: COMMIT_INTERVAL
        inputType: FreeText
        description: Kafka commit interval in seconds
        value: 30
      - name: KAFKA_KEY_DESERIALIZER
        inputType: FreeText
        description: The key deserializer to use
        value: str
      - name: KAFKA_VALUE_DESERIALIZER
        inputType: FreeText
        description: the value deserializer to use
        value: json
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group name
        value: s3_direct_sink_v1.0
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        description: Where to start consuming if no offset exists
        value: earliest
      - name: LOGLEVEL
        inputType: FreeText
        description: Application logging level
        value: INFO
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        description: How many files can be written in parallel to storage at once (based on partitioning + batch size)
        value: 10
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: highway-2
    configuration:
      partitions: 4
      replicationFactor: 1
      retentionInMinutes: -1
      retentionInBytes: 524288000
  - name: watermarks__burocrats_watermarking_v1.2--watermarks
    configuration:
      partitions: 1
      cleanupPolicy: Compact
  - name: watermarks__burocrats_watermarking_v4_v1.2--watermarks
    configuration:
      partitions: 1
      cleanupPolicy: Compact
