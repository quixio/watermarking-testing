name: Traffic Generator
language: python
variables:
  - name: output
    inputType: OutputTopic
    description: Name of the output topic to write into
    defaultValue: csv-data
    required: true
  - name: MESSAGES_PER_BRAND_COLOUR
    inputType: FreeText
    description: Number of messages to generate per (brand, colour) pair each second
    defaultValue: 1
    required: false
  - name: RUN_ID_MIN_SECONDS
    inputType: FreeText
    description: Minimum number of seconds before rotating run_id
    defaultValue: 20
    required: false
  - name: RUN_ID_MAX_SECONDS
    inputType: FreeText
    description: Maximum number of seconds before rotating run_id
    defaultValue: 200
    required: false
  - name: IDLE_COLOUR_COUNT
    inputType: FreeText
    description: Number of colours to suppress simultaneously during idle phases (0 to disable)
    defaultValue: 3
    required: false
  - name: IDLE_DURATION_SECONDS
    inputType: FreeText
    description: Seconds each idle phase lasts
    defaultValue: 30
    required: false
  - name: ACTIVE_DURATION_SECONDS
    inputType: FreeText
    description: Seconds between idle phases (all colours active)
    defaultValue: 60
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
libraryItemId: starter-source
